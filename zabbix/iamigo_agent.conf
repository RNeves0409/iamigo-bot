# Configuração do Zabbix Agent para monitoramento do host iAmigo
# Instale com: sudo apt-get install zabbix-agent
# Inicie com: sudo systemctl enable --now zabbix-agent

Server=192.168.100.3
ServerActive=192.168.100.3
Hostname=iamigo-<hostname-do-host>

Include=/home/renato/projetos/iamigo/zabbix/conf.d/*.conf

LogFile=/var/log/zabbix/zabbix_agentd.log
LogFileSize=5
PidFile=/run/zabbix/zabbix_agentd.pid

UserParameter=system.cpu.load[,avg1]
UserParameter=system.memory.size,awk '/MemTotal/{print $2/1024}' /proc/meminfo
UserParameter=system.meminfo.memfree,awk '/MemFree/{print $2/1024}' /proc/meminfo
UserParameter=iamigo.process.state,pgrep -f "python.*main.py" >/dev/null 2>&1 && echo 1 || echo 0
UserParameter=iamigo.process.memory,pgrep -f "python.*main.py" | xargs -r ps -o rss= -p | head -1
UserParameter=iamigo.log.last.error,grep -E "erro|falha" /home/renato/projetos/iamigo/logs/bot.log | tail -1
