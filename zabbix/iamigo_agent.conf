# Configuração do Zabbix Agent para monitoramento do host/contêiner iAmigo
# (versão para Docker; o deployment do Zabbix é manutenção do usuário)
#
# Server=192.168.100.3   (Zabbix server)
# Hostname=iamigo-<hostname-do-host>
#
# Instalação sugerida (após o docker compose subir o iamigo-bot):
#   1. Instalar zabbix-agent no host
#   2. Ajustar Server/ServerActive e Hostname
#   3. Ativar os UserParameters abaixo
#
# UserParameter de exemplo (verificar no agente via zabbix_get):
#   iamigo.process.state  — container iamigo-bot em execução
#   iamigo.process.memory — RSS do processo do container
#   iamigo.healthcheck    — script zabbix/healthcheck.py (0/1/2)

# --- Arquivo principal (sem Include, para não depender de conf.d) ---
Server=192.168.100.3
ServerActive=192.168.100.3
Hostname=iamigo-iamigo

LogFile=/var/log/zabbix/zabbix_agentd.log
LogFileSize=5
PidFile=/run/zabbix/zabbix_agentd.pid

# --- UserParameters ---
UserParameter=iamigo.process.state,
    docker inspect -f {{.State.Running}} iamigo-bot 2>/dev/null | grep -q true && echo 1 || echo 0

UserParameter=iamigo.process.memory,
    docker inspect -f {{.State.Pid}} iamigo-bot 2>/dev/null | xargs -r docker top iamigo-bot --format '{{.CPUPerc}}' | head -1

UserParameter=iamigo.healthcheck,
    /usr/bin/python3 /home/renato/projetos/iamigo/zabbix/healthcheck.py

UserParameter=iamigo.log.last.error,
    grep -E "erro|falha" /var/log/iamigo/bot.log 2>/dev/null | tail -1
