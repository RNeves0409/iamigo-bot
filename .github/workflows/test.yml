# GitHub Actions: executa os testes em cada push/pull_request

name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Preparar ambiente virtual
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip

      - name: Executar testes
        run: |
          . .venv/bin/activate
          python -m unittest test_db -v
          python -m unittest tests.test_service -v
